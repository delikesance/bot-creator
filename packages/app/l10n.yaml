# Configuration i18n (Flutter gen_l10n).
# Les traductions sont gérées dans les fichiers .arb (lib/l10n/*.arb).
# Générer le code Dart avec :  flutter gen-l10n
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-dir: lib/l10n
output-localization-file: app_localizations.dart
output-class: AppLocalizations
